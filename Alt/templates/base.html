<!-- base.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Your Title Here{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/basestyles.css' %}">
    {% block extra_css %}{% endblock %}

</head>
<body>

        <nav>
            <div class="logo">Altrue Global</div>

    <footer>
